services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/YOUR_GITHUB_USERNAME/smart-parking-backend:latest}
    container_name: smart-parking-backend
    env_file:
      - .env.backend.prod
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - smart-parking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

networks:
  smart-parking-network:
    name: smart-parking-network
