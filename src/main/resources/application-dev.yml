spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

khalti:
  initiate:
    url: ${KHALTI_INITIATE_URL:https://dev.khalti.com/api/v2/epayment/initiate/}
  verify:
    url: ${KHALTI_VERIFY_URL:https://dev.khalti.com/api/v2/epayment/lookup/}
  return:
    url: ${KHALTI_RETURN_URL:http://localhost:8080/api/payments/khalti/verify}
  secret:
    key: ${KHALTI_SECRET_KEY}

app:
  website:
    url: ${APP_WEBSITE_URL:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

  auth:
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG
