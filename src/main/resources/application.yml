spring:
  application:
    name: SmartParking

  # Database configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Khalti payment integration
khalti:
  initiate:
    url: https://dev.khalti.com/api/v2/epayment/initiate/
  verify:
    url: https://dev.khalti.com/api/v2/epayment/lookup/
  return:
    url: ${KHALTI_RETURN_URL:http://localhost:8080/api/payments/khalti/verify}
  secret:
    key: "Key 05bf95cc57244045b8df5fad06748dab"

app:
  website:
    url: ${APP_WEBSITE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:mysecretkey}
    access-expiration: 900000 # 15 minutes
    refresh-expiration: 604800000 # 7 days

# Actuator Management Endpoints
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
