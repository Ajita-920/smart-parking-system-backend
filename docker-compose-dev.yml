services:
  postgresdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-parking-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_parking"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: postgres
    depends_on:
      postgresdb:
        condition: service_healthy
    networks:
      - smart-parking-dev-network
    command: >
      sh -c "psql -h postgresdb -U postgres -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'smart_parking'\" | grep -q 1 || psql -h postgresdb -U postgres -d postgres -c \"CREATE DATABASE smart_parking\""

  backend:
    build:
      context: .
      target: development
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - .:/app
      - m2_cache:/root/.m2
    env_file:
      - .env.backend.dev
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - smart-parking-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  m2_cache:
  postgres_data:

networks:
  smart-parking-dev-network:
    name: smart-parking-dev-network
