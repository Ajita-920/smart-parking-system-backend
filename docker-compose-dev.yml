services:
  backend:
    build:
      context: .
      target: development
    container_name: smart-parking-backend-dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - m2_cache:/root/.m2
    env_file:
      - .env.backend.dev
    networks:
      - smart-parking-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  m2_cache:

networks:
  smart-parking-dev-network:
    external: true
