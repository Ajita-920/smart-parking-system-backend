services:
  postgresdb:
    image: postgres:16-alpine
    container_name: smart-parking-postgres-dev
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-parking-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_parking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: development
    container_name: smart-parking-backend-dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - m2_cache:/root/.m2
    env_file:
      - .env.backend.dev
    depends_on:
      postgresdb:
        condition: service_healthy
    networks:
      - smart-parking-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  m2_cache:
  postgres_data:

networks:
  smart-parking-dev-network:
    external: true
